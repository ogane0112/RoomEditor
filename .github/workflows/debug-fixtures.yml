name: Debug fixtures (temporary)
on:
  push:
    branches: [claude/create-from-reference-mql44v]
    paths: ['.github/debug/**', '.github/workflows/debug-fixtures.yml']
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npx vite preview --port 4173 --strictPort &
          npx vite --port 5173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
          node scripts/e2e-photo-scan.mjs || true
      - run: cp .github/debug/dump-fixtures.mjs ./dump-fixtures.mjs && node dump-fixtures.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/three/__fixtures__
          git commit -m "Add real depth/detection fixtures for an eye-level room photo"
          git push origin HEAD:${GITHUB_REF_NAME}
