name: Probe models (temporary)
on:
  push:
    branches: [claude/create-from-reference-mql44v]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for a in onnx-community Xenova; do
            for q in metric detr yolos rtdetr dfine d-fine yolo; do
              echo "== $a / $q"
              curl -s "https://huggingface.co/api/models?author=$a&search=$q&limit=50" | jq -r '.[].id'
            done
          done
          for m in Xenova/detr-resnet-50 Xenova/yolos-small Xenova/yolos-tiny onnx-community/rtdetr_r18vd onnx-community/metric3d-vit-small; do
            echo "== files $m"
            curl -s "https://huggingface.co/api/models/$m/tree/main/onnx" | jq -r '.[]? | "\(.path) \(.size)"' | head -20
          done
